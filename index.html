<!DOCTYPE html>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #525659; margin: 0; padding: 40px 10px; display: flex; justify-content: center; }
        .page { background: white; max-width: 1500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }

        .row { display: flex; width: 100%; align-items: stretch; }
        .row img { display: block; margin: 0; padding: 0; border: none; object-fit: contain; }
        .w-100 { width: 100%; }
        .w-50 { width: 50%; }
    </style>
</head>

        <!-- Row 2: Two images side by side -->
